# CratePlugin config
# Crates themselves (location, block, rewards) are stored in crates.yml and
# are managed in-game with /crate commands - you usually won't hand edit that file.

spin:
  # how long the CS2-style spin animation runs, in ticks (20 ticks = 1 second)
  duration-ticks: 60
  # ticks between reel updates at the START of the spin (fast)
  start-speed: 2
  # ticks between reel updates at the END of the spin (slow, dramatic)
  end-speed: 8

messages:
  prefix: "&8[&6Crates&8] &r"
  no-permission: "&cYou don't have permission to do that."
  need-key: "&cYou need a &e%key% &ckey to open this crate."
  key-consumed: "&aYou used a %key% key and opened %crate%!"
  key-given: "&aYou gave %amount%x %key% key(s) to %player%."
  key-received: "&aYou received %amount%x %key% key(s)."
  key-all-sent: "&aSent %amount%x %key% key(s) to %count% online player(s)."
  crate-created: "&aCreated crate &e%crate%&a. Now run /crate setblock %crate% <material> while looking at a block."
  crate-block-set: "&aCrate &e%crate% &ais now bound to that block (&e%material%&a)."
  crate-not-found: "&cNo crate named %crate% found."
  reward-added: "&aAdded reward &e%reward% &ato crate %crate% (weight %weight%)."
  win-broadcast: "&e%player% &fopened &e%crate% &fand won &6%reward%&f!"

# Example reference for what a crate looks like internally (see crates.yml after you create one):
# prime:
#   material: ENDER_CHEST
#   key: prime_key
#   rewards:
#     - name: "Prime Pickaxe"
#       type: PRIME_PICKAXE
#       weight: 5
#     - name: "Diamonds x8"
#       material: DIAMOND
#       amount: 8
#       weight: 30
#     - name: "Emerald"
#       material: EMERALD
#       amount: 1
#       weight: 65
