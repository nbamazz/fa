name: Build plugin jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: CratePlugin/pom.xml
      - run: mvn -B package
        working-directory: CratePlugin
      - uses: actions/upload-artifact@v4
        with:
          name: CratePlugin-jar
          path: CratePlugin/target/CratePlugin.jar
