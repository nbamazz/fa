name: PrimeSMPSettings
version: '1.0.0'
main: com.primesmp.settings.PrimeSMPSettings
api-version: '1.20'
author: PrimeSMP
description: Per-player toggles to disable chat and nearby mob spawning.

commands:
  primesettings:
    description: Manage PrimeSMP per-player settings.
    usage: /<command> chat|mobs [on|off] [player]
    permission: primesmp.settings.self

permissions:
  primesmp.settings.self:
    description: Allows toggling your own chat/mob-spawn settings.
    default: true
  primesmp.settings.others:
    description: Allows toggling other players' chat/mob-spawn settings.
    default: op
